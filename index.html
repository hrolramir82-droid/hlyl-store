<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HL&L Store | Detalles que marcan</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fafafa;color:#111}
header{background:#fff;border-bottom:1px solid #e8e8e8;position:sticky;top:0;z-index:5}.wrap{max-width:1100px;margin:auto;padding:0 18px}
.head{text-align:center;padding:20px 0 10px}h1{margin:0;font-size:30px}.tag{color:#666;margin-top:5px}
.filters{display:flex;gap:8px;overflow:auto;padding:10px 0 15px;justify-content:center}.filters button{border:1px solid #ddd;background:#fff;border-radius:999px;padding:10px 15px;font-weight:700;white-space:nowrap}.filters .active{background:#111;color:#fff}
main{padding:25px 0 50px}.status{text-align:center;color:#777;padding:30px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{background:#fff;border:1px solid #e8e8e8;border-radius:18px;overflow:hidden;display:flex;flex-direction:column}.card img{width:100%;aspect-ratio:1;object-fit:cover;background:#eee}.body{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.cat{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#777}h2{font-size:18px;line-height:1.25;margin:0}.desc{font-size:14px;color:#666;line-height:1.4;margin:0}.price{font-size:21px;font-weight:800}.meta{font-size:13px;color:#666}
.wa{margin-top:auto;text-align:center;text-decoration:none;background:#25D366;color:#fff;border-radius:10px;padding:12px;font-weight:700}
footer{background:#111;color:#fff;text-align:center;padding:25px 15px}footer a{color:#fff}
@media(max-width:600px){h1{font-size:27px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.body{padding:10px}h2{font-size:15px}.desc{font-size:12px}.price{font-size:17px}.wa{font-size:12px;padding:10px 5px}}
</style></head>
<body>
<header><div class="wrap"><div class="head"><h1>HL&L Store</h1><div class="tag">Detalles que marcan</div></div>
<div class="filters" id="filters"><button class="active" data-cat="Todos">Todos</button><button data-cat="Hoppies">Hoppies</button><button data-cat="Termos">Termos</button><button data-cat="Billeteras">Billeteras</button></div></div></header>
<main class="wrap"><div id="status" class="status">Cargando productos...</div><div id="grid" class="grid"></div></main>
<footer><strong>HL&L Store</strong> — Detalles que marcan<br><span style="display:inline-block;margin-top:8px">Pedidos: <a href="https://wa.me/595984334677">0984 334 677</a></span></footer>
<script>
const {createClient}=supabase;
const db=createClient("https://jdkfitrgaidjudfwjzez.supabase.co","sb_publishable_z-sBZwxJ4YxdyDj09JZgWw_7hMIhzNx"); const WA="595984334677"; let products=[];
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const money=n=>"G. "+Number(n||0).toLocaleString("es-PY");
function render(cat="Todos"){const list=cat==="Todos"?products:products.filter(p=>p.category===cat);const g=document.getElementById("grid");
if(!list.length){g.innerHTML="<div style='grid-column:1/-1;text-align:center;padding:40px;color:#777'>No hay productos disponibles.</div>";return}
g.innerHTML=list.map(p=>{const msg=encodeURIComponent(`Hola HL&L Store, quiero consultar por: ${p.name}. Precio: ${money(p.price)}. ¿Qué colores y disponibilidad tienen?`);
return `<article class="card"><img src="${esc(p.image_url||"")}" alt="${esc(p.name)}" loading="lazy"><div class="body"><div class="cat">${esc(p.category)}</div><h2>${esc(p.name)}</h2>${p.capacity?`<div class="meta">Capacidad: ${esc(p.capacity)}</div>`:""}<p class="desc">${esc(p.description||"Personalizable con grabado láser.")}</p><div class="price">${money(p.price)}</div><div class="meta">Colores y stock: consultar</div><a class="wa" target="_blank" href="https://wa.me/${WA}?text=${msg}">Consultar por WhatsApp</a></div></article>`}).join("")}
async function load(){const {data,error}=await db.from("products").select("*").eq("active",true).order("created_at",{ascending:false});if(error){document.getElementById("status").textContent="No se pudieron cargar los productos.";return}products=data||[];document.getElementById("status").style.display="none";render()}
document.querySelectorAll("#filters button").forEach(b=>b.onclick=()=>{document.querySelectorAll("#filters button").forEach(x=>x.classList.remove("active"));b.classList.add("active");render(b.dataset.cat)});load();
</script></body></html>
