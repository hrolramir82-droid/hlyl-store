<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HL&L Store | Administración</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7f7f7;color:#111}.wrap{max-width:950px;margin:auto;padding:18px}
header{background:#111;color:#fff}h1{margin:0;font-size:24px}.panel{background:#fff;border:1px solid #e5e5e5;border-radius:16px;padding:18px;margin:18px 0}
input,select,textarea{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;font:inherit;margin-top:6px}label{display:block;font-weight:700;margin-top:12px}textarea{min-height:90px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}.primary{background:#111;color:#fff}.green{background:#25D366;color:#fff}.danger{background:#e53935;color:#fff}.light{background:#eee}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.hidden{display:none!important}.msg{padding:10px;border-radius:10px;margin:10px 0;background:#eaf8ed}.small{font-size:13px;color:#666}
.item{display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:center;border-top:1px solid #eee;padding:12px 0}.item img{width:70px;height:70px;object-fit:cover;border-radius:10px;background:#eee}
.login{max-width:430px;margin:40px auto}@media(max-width:650px){.row{grid-template-columns:1fr}.item{grid-template-columns:60px 1fr}.item .actions{grid-column:1/-1}.item img{width:60px;height:60px}}
</style></head><body>
<header><div class="wrap"><h1>HL&L Store — Administración</h1></div></header>
<div id="login" class="panel login"><h2>Ingresar</h2><p class="small">Usa el usuario creado en Supabase.</p>
<label>Correo<input id="email" type="email"></label><label>Contraseña<input id="password" type="password"></label>
<div class="actions"><button class="primary" id="loginBtn">Ingresar</button></div><div id="loginMsg" class="small"></div></div>
<div id="app" class="wrap hidden">
<div class="panel"><strong id="userEmail"></strong><button class="light" id="logoutBtn" style="float:right">Cerrar sesión</button><div class="small">Panel privado de productos</div></div>
<div class="panel"><h2 id="formTitle">Agregar producto</h2><div id="msg"></div>
<div class="row"><div><label>Nombre<input id="name"></label></div><div><label>Categoría<select id="category"><option>Hoppies</option><option>Termos</option><option>Billeteras</option></select></label></div></div>
<div class="row"><div><label>Capacidad<input id="capacity" placeholder="Ej.: 1 litro"></label></div><div><label>Precio (Gs.)<input id="price" type="number" min="0"></label></div></div>
<div class="row"><div><label>Colores<input id="colors" placeholder="Ej.: negro, azul, rojo"></label></div><div><label>Stock<input id="stock" type="number" min="0" placeholder="Vacío = consultar"></label></div></div>
<label>Descripción<textarea id="description"></textarea></label><label>Foto<input id="image" type="file" accept="image/*"></label>
<div id="preview" class="small"></div><label style="display:flex;gap:8px;align-items:center"><input id="active" type="checkbox" checked style="width:auto"> Mostrar en la tienda</label>
<div class="actions"><button class="primary" id="saveBtn">Guardar producto</button><button class="light hidden" id="cancelBtn">Cancelar edición</button><button class="green" id="seedBtn">Cargar catálogo inicial (9)</button></div></div>
<div class="panel"><h2>Productos cargados</h2><div id="list">Cargando...</div></div></div>
<script>
const {createClient}=supabase;const db=createClient("https://jdkfitrgaidjudfwjzez.supabase.co","sb_publishable_z-sBZwxJ4YxdyDj09JZgWw_7hMIhzNx");const bucket="product-images";let editingId=null,products=[];
const $=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));const money=n=>"G. "+Number(n||0).toLocaleString("es-PY");
function msg(t,ok=true){$("msg").innerHTML=`<div class="msg" style="${ok?"":"background:#ffecec"}">${esc(t)}</div>`}
function clearForm(){editingId=null;$("formTitle").textContent="Agregar producto";$("saveBtn").textContent="Guardar producto";$("cancelBtn").classList.add("hidden");["name","capacity","price","colors","stock","description"].forEach(x=>$(x).value="");$("image").value="";$("preview").textContent="";$("active").checked=true}
async function admin(user){const {data,error}=await db.from("admins").select("user_id").eq("user_id",user.id).maybeSingle();return !error&&!!data}
async function refresh(){const {data,error}=await db.from("products").select("*").order("created_at",{ascending:false});if(error){$("list").textContent=error.message;return}products=data||[];render()}
function render(){if(!products.length){$("list").innerHTML="<p class='small'>Todavía no hay productos.</p>";return}$("list").innerHTML=products.map(p=>`<div class="item"><img src="${esc(p.image_url||"")}"><div><strong>${esc(p.name)}</strong><div class="small">${esc(p.category)} · ${money(p.price)} · ${p.active?"Publicado":"Oculto"}</div></div><div class="actions"><button class="light" onclick="editP('${p.id}')">Editar</button><button class="danger" onclick="delP('${p.id}')">Eliminar</button></div></div>`).join("")}
window.editP=id=>{const p=products.find(x=>x.id===id);if(!p)return;editingId=id;$("formTitle").textContent="Editar producto";$("saveBtn").textContent="Guardar cambios";$("cancelBtn").classList.remove("hidden");$("name").value=p.name||"";$("category").value=p.category||"Hoppies";$("capacity").value=p.capacity||"";$("price").value=p.price||"";$("colors").value=p.colors||"";$("stock").value=p.stock??"";$("description").value=p.description||"";$("active").checked=p.active!==false;$("preview").textContent=p.image_url?"Foto actual cargada.":"";scrollTo({top:0,behavior:"smooth"})}
window.delP=async id=>{if(!confirm("¿Eliminar este producto?"))return;const {error}=await db.from("products").delete().eq("id",id);if(error){alert(error.message);return}await refresh();msg("Producto eliminado.")}
$("cancelBtn").onclick=clearForm;$("image").onchange=()=>{if($("image").files[0])$("preview").textContent="Foto seleccionada: "+$("image").files[0].name}
$("saveBtn").onclick=async()=>{const name=$("name").value.trim(),price=Number($("price").value);if(!name||!price){msg("Completá nombre y precio.",false);return}$("saveBtn").disabled=true;try{let image_url=editingId?(products.find(p=>p.id===editingId)?.image_url||""):"";const f=$("image").files[0];if(f){const ext=(f.name.split(".").pop()||"jpg").toLowerCase(),path=crypto.randomUUID()+"."+ext;const up=await db.storage.from(bucket).upload(path,f,{upsert:false,contentType:f.type||"image/jpeg"});if(up.error)throw up.error;image_url=db.storage.from(bucket).getPublicUrl(path).data.publicUrl}
const payload={name,category:$("category").value,capacity:$("capacity").value.trim(),price,colors:$("colors").value.trim(),stock:$("stock").value===""?null:Number($("stock").value),description:$("description").value.trim(),image_url,active:$("active").checked,updated_at:new Date().toISOString()};
const r=editingId?await db.from("products").update(payload).eq("id",editingId):await db.from("products").insert(payload);if(r.error)throw r.error;msg(editingId?"Producto actualizado.":"Producto agregado.");clearForm();await refresh()}catch(e){msg("Error: "+e.message,false)}finally{$("saveBtn").disabled=false}}
$("seedBtn").onclick=async()=>{if(!confirm("Cargar los 9 productos iniciales?"))return;$("seedBtn").disabled=true;const seed=[{"name": "Hoppie 1 litro personalizado", "category": "Hoppies", "capacity": "1 litro", "price": 80000, "description": "Hoppie de 1 litro, práctico y cómodo para acompañarte todos los días. Personalizable con grabado láser.", "image_url": "https://hrolramir82-droid.github.io/hlyl-store/images/hoppie-1l.jpg", "colors": "", "stock": null, "active": true}, {"name": "Hoppie 820 ml personalizado", "category": "Hoppies", "capacity": "820 ml", "price": 70000, "description": "Hoppie de 820 ml, práctico y versátil para acompañarte durante el día. Personalizable con grabado láser.", "image_url": "https://hrolramir82-droid.github.io/hlyl-store/images/hoppie-820ml.jpg", "colors": "", "stock": null, "active": true}, {"name": "Hoppie 650 ml personalizado", "category": "Hoppies", "capacity": "650 ml", "price": 65000, "description": "Hoppie de 650 ml, práctico y cómodo para acompañarte todos los días. Personalizable con grabado láser.", "image_url": "https://hrolramir82-droid.github.io/hlyl-store/images/hoppie-650ml.jpg", "colors": "", "stock": null, "active": true}, {"name": "Hoppie 400 ml personalizado", "category": "Hoppies", "capacity": "400 ml", "price": 55000, "description": "Hoppie de 400 ml, compacto y práctico, ideal para llevar a cualquier lugar. Personalizable con grabado láser.", "image_url": "https://hrolramir82-droid.github.io/hlyl-store/images/hoppie-400ml.jpg", "colors": "", "stock": null, "active": true}, {"name": "Termo para tereré 2,5 litros", "category": "Termos", "capacity": "2,5 litros", "price": 160000, "description": "Termo de 2,5 litros ideal para tereré, con vaso y bombilla. Personalizable con grabado láser.", "image_url": "https://hrolramir82-droid.github.io/hlyl-store/images/termo-25l.jpg", "colors": "", "stock": null, "active": true}, {"name": "Termo 1,3 litros personalizado", "category": "Termos", "capacity": "1,3 litros", "price": 125000, "description": "Termo de 1,3 litros con vaso, ideal para tereré y uso diario. Personalizable con grabado láser.", "image_url": "https://hrolramir82-droid.github.io/hlyl-store/images/termo-13l.jpg", "colors": "", "stock": null, "active": true}, {"name": "Termo tipo galón 2 litros", "category": "Termos", "capacity": "2 litros", "price": 130000, "description": "Termo tipo galón de 2 litros, ideal para tereré y para compartir. Personalizable con grabado láser.", "image_url": "https://hrolramir82-droid.github.io/hlyl-store/images/termo-galon-2l.jpg", "colors": "", "stock": null, "active": true}, {"name": "Termo para mate 1 litro", "category": "Termos", "capacity": "1 litro", "price": 100000, "description": "Termo para mate de 1 litro, práctico y cómodo para el uso diario. Personalizable con grabado láser.", "image_url": "https://hrolramir82-droid.github.io/hlyl-store/images/termo-mate-1l.jpg", "colors": "", "stock": null, "active": true}, {"name": "Billetera personalizada", "category": "Billeteras", "capacity": "", "price": 110000, "description": "Billetera de diseño elegante y práctico, ideal para regalar. Personalizable con grabado láser.", "image_url": "https://hrolramir82-droid.github.io/hlyl-store/images/billetera.jpg", "colors": "", "stock": null, "active": true}];const r=await db.from("products").insert(seed);if(r.error)alert(r.error.message);else{msg("¡Se cargaron los 9 productos iniciales!");await refresh()}$("seedBtn").disabled=false}
$("loginBtn").onclick=async()=>{const {data,error}=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(error){$("loginMsg").textContent=error.message;return}start(data.user)}
$("logoutBtn").onclick=()=>db.auth.signOut();async function start(u){if(!u)return;if(!await admin(u)){await db.auth.signOut();$("loginMsg").textContent="Este usuario no tiene permisos de administrador.";return}$("login").classList.add("hidden");$("app").classList.remove("hidden");$("userEmail").textContent=u.email||"Administrador";await refresh()}db.auth.getSession().then(x=>start(x.data.session?.user));
</script></body></html>
