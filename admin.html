<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HL&L | Productos</title><style>body{font-family:Arial;margin:0;background:#f5f5f5}.wrap{max-width:850px;margin:auto;padding:22px}.box{background:#fff;padding:20px;border-radius:14px;margin-bottom:18px}input,textarea,select{width:100%;padding:11px;margin:6px 0 12px;border:1px solid #ccc;border-radius:8px}button{padding:11px 15px;border:0;border-radius:8px;background:#111;color:#fff;margin:4px}.gold{background:#b98b35}.danger{background:#a22}.item{display:flex;justify-content:space-between;border-bottom:1px solid #ddd;padding:10px 0}</style></head><body><div class="wrap"><h1>HL&L — Cargar productos</h1><div class="box"><p>Desde el celular podés preparar tu catálogo. Completá los datos y descargá el archivo <b>products.json</b>.</p><label>Nombre</label><input id="name" placeholder="Ej.: Hoppie 800 ml personalizado"><label>Categoría</label><select id="category"><option>Termos</option><option>Hoppies</option><option>Vasos</option><option>Billeteras</option><option>Otros</option></select><label>Precio (Gs.)</label><input id="price" type="number" placeholder="65000"><label>Descripción</label><textarea id="description"></textarea><label>URL de imagen</label><input id="image" placeholder="https://..."><button class="gold" onclick="add()">Agregar producto</button></div><div class="box"><h2>Productos</h2><div id="list"></div><button class="gold" onclick="download()">Descargar products.json</button></div></div><script>let data=JSON.parse(localStorage.getItem('hl_products')||'[]');function save(){localStorage.setItem('hl_products',JSON.stringify(data));render()}function add(){let p={name:name.value.trim(),category:category.value,price:Number(price.value||0),description:description.value.trim(),image:image.value.trim()};if(!p.name)return alert('Escribí el nombre.');data.push(p);save();['name','price','description','image'].forEach(x=>document.getElementById(x).value='')}function remove(i){data.splice(i,1);save()}function render(){list.innerHTML=data.map((p,i)=>`<div class="item"><span><b>${p.name}</b><br>${p.category} · ${p.price||'Consultar'} Gs.</span><button class="danger" onclick="remove(${i})">Eliminar</button></div>`).join('')||'<p>No hay productos.</p>'}function download(){let b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='products.json';a.click()}render()</script></body></html>
